<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Audio</title>
<style>
  :root {
    --bg: #0f1015;
    --card: #191a22;
    --line: #2a2c38;
    --text: #edeef3;
    --muted: #9296a6;
    --accent: #d6336c;
    --accent-2: #f76707;
    --ok: #37b24d;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: radial-gradient(900px 500px at 50% -10%, #241a2e 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: -0.4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #12131a;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .hint { margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .msg {
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 13.5px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.err { background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.35); color: var(--err); }
  .msg.info { background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--muted); }
  .result { margin-top: 16px; display: none; }
  .result.show { display: block; }
  .meta { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .art {
    width: 56px; height: 56px; border-radius: 10px; object-fit: cover;
    background: #22232d; flex: none;
  }
  .title { font-weight: 600; font-size: 15px; word-break: break-word; }
  .by { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  audio { width: 100%; margin-bottom: 10px; }
  a.dl {
    display: block;
    text-align: center;
    padding: 11px;
    border-radius: 10px;
    background: rgba(55,178,77,.12);
    border: 1px solid rgba(55,178,77,.4);
    color: var(--ok);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .matches { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); display: none; }
  .matches.show { display: block; }
  .mhead { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 10px; }
  .song {
    font-size: 13.5px; margin-bottom: 12px; padding: 9px 11px; border-radius: 9px;
    background: rgba(255,255,255,.04); border: 1px solid var(--line);
  }
  .song b { color: var(--text); }
  .song .via { color: var(--muted); font-size: 12px; display: block; margin-top: 3px; }
  .yt {
    display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px;
    text-decoration: none; color: inherit; border: 1px solid transparent;
  }
  .yt:hover { background: rgba(255,255,255,.05); border-color: var(--line); }
  .yt.best { background: rgba(214,51,108,.09); border-color: rgba(214,51,108,.35); }
  .yt img { width: 68px; height: 38px; border-radius: 6px; object-fit: cover; flex: none; background: #22232d; }
  .yt .t { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .yt .c { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .badge {
    flex: none; font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 20px;
    background: rgba(55,178,77,.15); color: var(--ok);
  }
  .badge.mid { background: rgba(247,103,7,.15); color: var(--accent-2); }
  .badge.low { background: rgba(255,255,255,.07); color: var(--muted); }
  .spin {
    width: 14px; height: 14px; display: inline-block; vertical-align: -2px;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; animation: s .7s linear infinite; margin-right: 7px;
  }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Reel Audio</h1>
  <p class="sub">Paste an Instagram reel or post link — get the audio as MP3.</p>

  <div class="card">
    <form class="row" id="form">
      <input id="url" type="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off" required>
      <button id="go" type="submit">Extract</button>
    </form>
    <div class="hint">Works with reels, posts and IGTV. Private posts need cookies — see the README.</div>

    <div class="msg" id="msg"></div>

    <div class="result" id="result">
      <div class="meta">
        <img class="art" id="art" alt="" hidden>
        <div>
          <div class="title" id="title"></div>
          <div class="by" id="by"></div>
        </div>
      </div>
      <audio id="audio" controls preload="metadata"></audio>
      <a class="dl" id="dl" download>Download MP3</a>

      <div class="matches" id="matches">
        <div class="mhead" id="mhead">Finding the full song…</div>
        <div id="song"></div>
        <div id="ytlist"></div>
        <form class="row" id="sform" style="margin-top:12px">
          <input id="q" type="text" placeholder="Search by song name or a line you caught…" autocomplete="off">
          <button id="sgo" type="submit" style="background:rgba(255,255,255,.08)">Search</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const form = $('form'), go = $('go'), msg = $('msg'), result = $('result');

function show(el, kind, text) {
  el.className = 'msg show ' + kind;
  el.textContent = text;
}
function hide(el) { el.className = 'msg'; }

function fmtSize(b) {
  return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
}
function fmtDur(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function badgeClass(score) {
  return score >= 70 ? '' : score >= 45 ? ' mid' : ' low';
}

async function findSong(token) {
  const box = $('matches'), head = $('mhead'), song = $('song'), list = $('ytlist');
  box.classList.add('show');
  head.textContent = 'Finding the full song…';
  song.innerHTML = '';
  list.innerHTML = '';

  let data;
  try {
    const r = await fetch('/api/match/' + token, { method: 'POST' });
    data = await r.json();
  } catch { data = { identified: false, reason: 'Song lookup failed.' }; }

  if (!data.identified) {
    head.textContent = 'Song';
    song.innerHTML = `<div class="song" style="color:var(--muted)">${data.reason || 'Not identified.'}</div>`;
    return;
  }

  const s = data.song;
  head.textContent = 'Song · tap a result to open on YouTube';
  song.innerHTML = `<div class="song"><b>${s.track}</b>${s.artist ? ' — ' + s.artist : ''}
    <span class="via">identified via ${s.source}${s.shazam_url ? ` · <a href="${s.shazam_url}" target="_blank" rel="noopener" style="color:var(--muted)">Shazam</a>` : ''}</span></div>`;

  if (!data.results.length) {
    list.innerHTML = `<div class="song" style="color:var(--muted)">No YouTube results came back — try searching the name above.</div>`;
    return;
  }

  renderYT(list, data.results);
}

function renderYT(list, results) {
  list.innerHTML = results.map((v, i) => `
    <a class="yt${i === 0 ? ' best' : ''}" href="${v.url}" target="_blank" rel="noopener">
      <img src="${v.thumbnail}" alt="">
      <div style="flex:1;min-width:0">
        <div class="t">${v.title}</div>
        <div class="c">${v.channel}${v.duration ? ' · ' + fmtDur(v.duration) : ''}</div>
      </div>
      <span class="badge${i === 0 ? '' : badgeClass(v.score)}">${i === 0 ? 'BEST' : v.score + '%'}</span>
    </a>`).join('');
}

$('sform').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  const sgo = $('sgo'), list = $('ytlist');
  sgo.disabled = true;
  sgo.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q })
    });
    const d = await r.json();
    $('song').innerHTML = `<div class="song">Results for <b>${q}</b></div>`;
    if (d.results && d.results.length) renderYT(list, d.results);
    else list.innerHTML = `<div class="song" style="color:var(--muted)">Nothing came back for that.</div>`;
  } catch {
    list.innerHTML = `<div class="song" style="color:var(--muted)">Search failed — is the server still running?</div>`;
  } finally {
    sgo.disabled = false;
    sgo.textContent = 'Search';
  }
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!url) return;

  go.disabled = true;
  go.innerHTML = '<span class="spin"></span>Working';
  result.classList.remove('show');
  show(msg, 'info', 'Fetching the post and pulling the audio out…');

  try {
    const r = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await r.json();

    if (!r.ok) { show(msg, 'err', data.error || 'Something went wrong.'); return; }

    hide(msg);
    $('title').textContent = data.track || data.title || data.filename;
    const bits = [data.artist || data.uploader, fmtDur(data.duration), fmtSize(data.size)].filter(Boolean);
    $('by').textContent = bits.join(' · ');

    const art = $('art');
    if (data.thumbnail) { art.src = data.thumbnail; art.hidden = false; }
    else { art.hidden = true; }

    $('audio').src = '/api/file/' + data.token;
    const dl = $('dl');
    dl.href = '/api/file/' + data.token + '?dl=1';
    dl.setAttribute('download', data.filename);
    dl.textContent = 'Download  ' + data.filename;
    result.classList.add('show');
    findSong(data.token);
  } catch (err) {
    show(msg, 'err', 'Could not reach the server — is it still running?');
  } finally {
    go.disabled = false;
    go.textContent = 'Extract';
  }
});
</script>
</body>
</html>
